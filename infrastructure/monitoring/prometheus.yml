# Prometheus Configuration for TAV-X

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'tavx-local'
    environment: 'development'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets: []
          # - alertmanager:9093

# Load rules once and periodically evaluate them
rule_files:
  # - "alerts/*.yml"

# Scrape configurations
scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Node exporter (if running)
  - job_name: 'node'
    static_configs:
      - targets: []
        # - 'node-exporter:9100'

  # TAV-X Services (add as they're deployed)
  - job_name: 'auth-service'
    static_configs:
      - targets: ['auth-service:3001']
    metrics_path: '/metrics'

  - job_name: 'booking-service'
    static_configs:
      - targets: ['booking-service:3002']
    metrics_path: '/metrics'

  - job_name: 'vehicle-service'
    static_configs:
      - targets: ['vehicle-service:3003']
    metrics_path: '/metrics'

  - job_name: 'tour-service'
    static_configs:
      - targets: ['tour-service:3004']
    metrics_path: '/metrics'

  - job_name: 'payment-service'
    static_configs:
      - targets: ['payment-service:3005']
    metrics_path: '/metrics'

  - job_name: 'voice-service'
    static_configs:
      - targets: ['voice-service:3006']
    metrics_path: '/metrics'

  - job_name: 'notification-service'
    static_configs:
      - targets: ['notification-service:3007']
    metrics_path: '/metrics'

  - job_name: 'analytics-service'
    static_configs:
      - targets: ['analytics-service:3008']
    metrics_path: '/metrics'

  - job_name: 'inspection-service'
    static_configs:
      - targets: ['inspection-service:3009']
    metrics_path: '/metrics'

  # PostgreSQL exporter
  - job_name: 'postgres'
    static_configs:
      - targets: []
        # - 'postgres-exporter:9187'

  # Redis exporter
  - job_name: 'redis'
    static_configs:
      - targets: []
        # - 'redis-exporter:9121'

  # RabbitMQ
  - job_name: 'rabbitmq'
    static_configs:
      - targets: ['rabbitmq:15692']

  # Kong Gateway
  - job_name: 'kong'
    static_configs:
      - targets: []
        # - 'kong:8001'
